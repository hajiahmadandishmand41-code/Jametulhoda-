<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d3a22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b8912e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <!-- Dome/mosque silhouette -->
  <path d="M100 28 C100 28 70 50 70 72 C70 88 83 98 100 98 C117 98 130 88 130 72 C130 50 100 28 100 28Z" fill="url(#gold)" opacity="0.9"/>
  <rect x="95" y="90" width="10" height="20" rx="2" fill="url(#gold)" opacity="0.9"/>
  <!-- Crescent on top -->
  <circle cx="100" cy="25" r="6" fill="url(#bg)"/>
  <circle cx="103" cy="24" r="5" fill="url(#gold)"/>
  <!-- Book shape -->
  <path d="M75 110 L100 102 L125 110 L125 145 L100 137 L75 145Z" fill="url(#gold)" opacity="0.85"/>
  <line x1="100" y1="102" x2="100" y2="137" stroke="url(#bg)" stroke-width="1.5"/>
  <!-- Arabic/Jama text -->
  <text x="100" y="165" text-anchor="middle" fill="url(#gold)" font-family="'Traditional Arabic', 'Scheherazade New', serif" font-size="20" font-weight="bold">جـامـة الـهـدى</text>
  <!-- Decorative dots -->
  <circle cx="50" cy="100" r="2" fill="url(#gold)" opacity="0.5"/>
  <circle cx="150" cy="100" r="2" fill="url(#gold)" opacity="0.5"/>
</svg>
